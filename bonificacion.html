<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="bonificacion.js"></script>
</head>

<body>

    <script>

        let h1 = crearNodoConTexto('h1', 'Julio César');

        let p = crearNodoConTexto('p', 'Julio César fue un importante político, militar y escritor romano. Es una de las figuras más conocidas de la historia de Roma.' );

        let h2 = crearNodoConTexto('h2', '¿Quién fue Julio César?');

        let pDos = crearNodoConTexto('p','Julio César nació en el año 100 a. C. y tuvo un papel fundamental en la transformación de la República romana. Principales logros');
        

        let h2D = crearNodoConTexto('h2', 'Principales logros');


        adicionarElementoABody(h1);
        adicionarElementoABody(p);
        adicionarElementoABody(h2);
        adicionarElementoABody(pDos);
        adicionarElementoABody(h2D);


        let ul = crearElemento('ul');

        let li = crearNodoConTexto(
            'li', 'Conquistó gran parte de la Galia.');

        let liDos = crearNodoConTexto(
            'li','Fue un destacado líder militar.');

        let liTres = crearNodoConTexto('li', 'Realizó importantes reformas políticas.' );

        let liCuatro = crearNodoConTexto(
            'li', 'Contribuyó al desarrollo del calendario juliano.');


        adicionarElementoAContenedor(li, ul);
        adicionarElementoAContenedor(liDos, ul);
        adicionarElementoAContenedor(liTres, ul);
        adicionarElementoAContenedor(liCuatro, ul);

        adicionarElementoABody(ul);

    </script>

</body>
</html>
